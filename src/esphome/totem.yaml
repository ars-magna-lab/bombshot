# =====================================================================
#  EL TOTEM DEL CHAMAN — bombshot v2 — Voice PE en modo AUTONOMO
# =====================================================================
#
#  Segundo juego sobre el mismo Voice PE, para la fiesta dino-neandertal
#  (2026). Un Simon ritual de CUATRO ELEMENTOS (fuego, agua, aire, tierra):
#  el totem pone el ARO del color del elemento y DICE su nombre, paso a
#  paso, y hay que repetir la secuencia con cuatro pulsadores. Fallo =
#  aro de lava. Cinco rondas seguidas = aro de fiesta.
#
#  VERSION MINIMA (2026-09-11, ajustada tras jugar): UNA sola ronda de
#  `objetivo` elementos (6), no incremental. Audio: tres pitidos de aviso
#  (Piiii, Pii, Pi), las cuatro palabras, "Has perdido." al fallar y
#  "¡Bien! Has ganado." al acertar. Nada mas. Los sonidos de la version
#  larga (redoble, erupcion, tambores...) siguen en sounds/ y en git
#  (commit 3d1e85c): recuperar uno es un audio_file + un totem_sonar +
#  su delay.
#
#    esphome config  totem.yaml    # valida
#    esphome run     totem.yaml    # compila + flashea
#
#  Plan, lista de materiales y esquema: docs/v2-plan.md (raiz del repo).
#
#  HEREDA DE LA V1 (standalone.yaml) TODO LO QUE DIO ESTABILIDAD; no
#  volver atras en nada de esto (los porques largos estan en el YAML de
#  la v1 y en CLAUDE.md, punto 4):
#   - Un unico script toca el altavoz (`totem_sonar`): PARA lo que suene y
#     lanza el clip nuevo. Nunca encola. Las esperas son `delay` fijos del
#     tamano real del fichero (duraciones medidas con ffprobe, ver [5]).
#   - Sin cronometros globales que sobrevivan entre rondas: el tiempo de
#     respuesta es un `delay` dentro de un script (`totem_espera`), y
#     acertar lo reinicia, fallar/terminar lo mata.
#   - `voice_assistant_leds` se apaga en cada fase Y por interval: son dos
#     particiones sobre las mismas 12 LEDs y el firmware de fabrica repinta.
#   - `reboot_timeout: 0s` en api y wifi.
#   - `grove_port_power` encendido ANTES del escaneo I2C (sin el, el puerto
#     Grove no lleva ni señal ni alimentacion).
#   - Se arma con TRIPLE CLIC en el boton central (`!extend`, concatena).
#
#  LO NUEVO: los pulsadores cuelgan de un MCP23017 (placa Waveshare
#  "MCP23017 IO Expansion Board") por I2C en el puerto Grove. Pines 0-7 =
#  PA0-PA7 en la numeracion de ESPHome.
#     PA0..PA3 -> pulsadores de los 4 elementos (a GND, pull-up interno)
#  SIMPLIFICADO EL 2026-09-11: sin LEDs externos. La version anterior tenia
#  un LED por elemento en PB0..PB3; se quito para llegar a tiempo. Ahora el
#  aro de 12 LEDs del propio Voice PE hace de "LED" (se pone entero del
#  color del elemento) y ademas el altavoz dice la palabra.
#  Direccion: en la Waveshare A0/A1/A2 van a nivel ALTO si no se puentean,
#  asi que sin tocar nada es 0x27. Si el escaneo I2C del arranque no la
#  encuentra: 1) grove_port_power, 2) puentes A0-A2, 3) cable.
# =====================================================================


# ---------------------------------------------------------------------
#  [0] BASE: firmware oficial completo, importado como paquete remoto
# ---------------------------------------------------------------------

packages:
  home-assistant-voice: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev

esphome:
  name: totem-chaman
  friendly_name: Totem del chaman

api:
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Totem Fallback"
    password: !secret wifi_ap_password
  reboot_timeout: 0s


# ---------------------------------------------------------------------
#  [1] AJUSTES DEL JUEGO (lo unico que hay que tocar para afinar)
# ---------------------------------------------------------------------

substitutions:
  # Elementos de la partida (una sola ronda, se dicen todos seguidos).
  objetivo: "6"
  # Ventana para pulsar el SIGUIENTE elemento, en ms. Cada acierto la
  # reinicia, asi que es "tiempo entre pulsaciones", no tiempo total.
  # En los ultimos `aviso_ms` suenan otra vez los pitidos (Piiii, Pii, Pi)
  # para avisar de que se acaba el tiempo.
  ventana_ms: "10000"
  aviso_ms: "3000"
  # Duracion de cada palabra de elemento (las cuatro miden 0.70 s exactos
  # por diseño, generar_totem.py, la voz acaba antes de 0.45) y pausa a
  # oscuras entre pasos. La pausa importa: sin ella dos pasos seguidos del
  # mismo elemento se ven como uno. 6 pasos x 0.95 s = 5.7 s de secuencia.
  paso_on_ms: "750"
  paso_off_ms: "200"


# ---------------------------------------------------------------------
#  [2] ESTADO DEL JUEGO
#
#    0 = ESPERA      (reposo; pulsar un elemento solo lo hace sonar y lucir)
#    1 = MOSTRANDO   (el totem toca la secuencia; los elementos se ignoran)
#    2 = RESPONDIENDO(le toca al jugador)
#    3 = GANADA
#    4 = PERDIDA
#
#  La secuencia se sortea ENTERA al armar (`objetivo` elementos) y se
#  muestra entera de una vez: UNA ronda, sin niveles incrementales
#  (pedido tras jugar la version incremental). `totem_nivel` queda fijo
#  en `objetivo`; se conserva la variable para poder volver al Simon
#  clasico con un cambio en totem_armar.
# ---------------------------------------------------------------------

globals:
  - id: totem_estado
    type: int
    restore_value: false
    initial_value: '0'
  - id: totem_secuencia
    type: int[16]            # de sobra; se usan `objetivo` posiciones
    restore_value: false
  - id: totem_nivel          # cuantos pasos tiene la ronda actual (1..objetivo)
    type: int
    restore_value: false
    initial_value: '1'
  - id: totem_pos            # siguiente paso que se espera del jugador
    type: int
    restore_value: false
    initial_value: '0'
  - id: totem_i              # contador del bucle de mostrar
    type: int
    restore_value: false
    initial_value: '0'
  - id: totem_resultado      # de la ultima pulsacion: 1 sigue, 2 ronda ok, 3 fallo
    type: int
    restore_value: false
    initial_value: '0'


# ---------------------------------------------------------------------
#  [3] PUERTO GROVE: alimentacion + bus I2C + MCP23017
#
#  Mismo contenido que modules/grove-i2c.yaml del firmware oficial, puesto
#  aqui a mano para que se vea. El firmware base ya tiene otro bus
#  (`internal_i2c`, GPIO5/6, para sus propios chips), por eso el MCP lleva
#  `i2c_id` explicito.
# ---------------------------------------------------------------------

switch:
  - platform: gpio
    pin: GPIO46
    id: grove_port_power
    restore_mode: ALWAYS_ON
    setup_priority: 1001   # antes del escaneo I2C (prioridad 1000)

i2c:
  - id: grove_i2c
    sda: GPIO1             # hilo blanco del Grove
    scl: GPIO2             # hilo amarillo del Grove
    scan: true             # en el log de arranque aparece "Found i2c device at 0x27"

mcp23017:
  - id: expansor
    i2c_id: grove_i2c
    address: 0x27          # Waveshare: A0/A1/A2 sin puentear = 111 = 0x27


# ---------------------------------------------------------------------
#  [4] LOS CUATRO ELEMENTOS
#
#  Cada elemento: un pulsador (PA n), un color del aro y una palabra.
#     n  elemento  color del aro   PA (boton)
#     0  FUEGO     rojo               PA0
#     1  AGUA      verde              PA1
#     2  AIRE      azul               PA2
#     3  TIERRA    lila               PA3
#
#  La palabra se llama snd_voz<n>: el nombre se construye concatenando,
#  como los numeros de la v1, asi que los cuatro audio_file de [5] TIENEN
#  que existir con ese nombre exacto. El color vive en `totem_color` [7].
# ---------------------------------------------------------------------

binary_sensor:
  - platform: gpio
    id: elem_boton_0
    name: "Totem fuego (rojo)"
    pin: {mcp23xxx: expansor, number: 0, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 50ms]
    on_press:
      - script.execute: {id: totem_pulsar, elemento: 0}
  - platform: gpio
    id: elem_boton_1
    name: "Totem agua (verde)"
    pin: {mcp23xxx: expansor, number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 50ms]
    on_press:
      - script.execute: {id: totem_pulsar, elemento: 1}
  - platform: gpio
    id: elem_boton_2
    name: "Totem aire (azul)"
    pin: {mcp23xxx: expansor, number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 50ms]
    on_press:
      - script.execute: {id: totem_pulsar, elemento: 2}
  - platform: gpio
    id: elem_boton_3
    name: "Totem tierra (lila)"
    pin: {mcp23xxx: expansor, number: 3, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 25ms, delayed_off: 50ms]
    on_press:
      - script.execute: {id: totem_pulsar, elemento: 3}

  # Triple clic en el boton central = armar (identico a la v1: `!extend`
  # concatena, el bloque de fabrica sigue intacto; aqui va SOLO lo nuevo).
  - id: !extend center_button
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - script.execute: totem_armar


# ---------------------------------------------------------------------
#  [5] AUDIOS. Duraciones REALES (ffprobe); los `delay` salen de aqui.
#
#    voz_fuego/agua/aire/tierra.flac  0.70 s cada uno (fijo por diseño)
#    cuenta.flac       1.96 s   (Piiii, Pii, Pi)
#    has_perdido.flac  1.10 s   ("Has perdido.")
#    bien_ganado.flac  1.88 s   ("¡Bien! Has ganado.")
#  TODOS a 48 kHz mono 16 BITS. Los dos veredictos eran de 24 bits (los
#  sacaba asi generar_voces.py) y con eso el Voice PE arranca un
#  remuestreador que se cuelga; desde ese momento descarta todo lo que se
#  le manda ("Queue full, URI dropped") hasta reiniciar. Sintoma: "a
#  partir de la segunda partida no suena nada". Si se anade un audio,
#  comprobar con ffprobe que es s16.
# ---------------------------------------------------------------------

audio_file:
  - id: snd_voz0
    file: sounds/voz_fuego.flac
  - id: snd_voz1
    file: sounds/voz_agua.flac
  - id: snd_voz2
    file: sounds/voz_aire.flac
  - id: snd_voz3
    file: sounds/voz_tierra.flac
  - id: snd_cuenta
    file: sounds/cuenta.flac
  - id: snd_perdiste
    file: sounds/has_perdido.flac
  - id: snd_bien_ganado
    file: sounds/bien_ganado.flac


# ---------------------------------------------------------------------
#  [6] EFECTOS DEL ARO (led_ring). Ver v1 para lo de las dos particiones.
# ---------------------------------------------------------------------

light:
  - id: !extend led_ring
    effects:
      - addressable_lambda:
          # El espiritu habla: blanco calido respirando despacio. Fase
          # MOSTRANDO. (Era violeta; desde que tierra es lila, se cambio
          # para que no se confundan.)
          name: "espiritu"
          update_interval: 40ms
          lambda: |-
            static float fase = 0;
            fase += 0.08f;
            float v = 0.35f + 0.65f * (0.5f + 0.5f * sinf(fase));
            for (int i = 0; i < it.size(); i++)
              it[i] = Color(255 * v, 170 * v, 110 * v);
      - addressable_lambda:
          # Te toca: verde con un punto blanco dando vueltas, como un
          # reloj de arena. Fase RESPONDIENDO.
          name: "turno"
          update_interval: 80ms
          lambda: |-
            static uint8_t cabeza = 0;
            for (int i = 0; i < it.size(); i++)
              it[i] = (i == cabeza) ? Color(255, 255, 255) : Color(0, 110, 30);
            cabeza = (cabeza + 1) % it.size();
      - addressable_lambda:
          # Lava: naranja/rojo burbujeando al azar. Erupcion.
          name: "lava"
          update_interval: 70ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              uint32_t r = random_uint32() % 4;
              it[i] = (r == 0) ? Color(255, 200, 40)
                    : (r == 1) ? Color(255, 80, 0)
                               : Color(160, 0, 0);
            }
      - addressable_lambda:
          # Fuego de fiesta: amarillo/naranja/rojo girando. Victoria.
          name: "hoguera"
          update_interval: 90ms
          lambda: |-
            static uint8_t offset = 0;
            static const Color paleta[6] = {
              Color(255, 200, 0), Color(255, 120, 0), Color(255, 30, 0),
              Color(255, 200, 0), Color(255, 255, 120), Color(255, 120, 0),
            };
            for (int i = 0; i < it.size(); i++) it[i] = paleta[(i + offset) % 6];
            offset = (offset + 1) % 6;
      - addressable_lambda:
          # Arcoiris girando (igual que en la v1).
          name: "arcoiris"
          update_interval: 60ms
          lambda: |-
            static int tono = 0;
            for (int i = 0; i < it.size(); i++) {
              float r = 0, g = 0, b = 0;
              hsv_to_rgb((tono + i * 30) % 360, 1.0f, 1.0f, r, g, b);
              it[i] = Color(r * 255, g * 255, b * 255);
            }
            tono = (tono + 8) % 360;


# ---------------------------------------------------------------------
#  [7] SCRIPTS DEL JUEGO
# ---------------------------------------------------------------------

script:
  # -------------------------------------------------- SONAR (unico sitio
  # que toca el altavoz; ver cabecera). mode: restart -> gana la ultima.
  - id: totem_sonar
    mode: restart
    parameters:
      fichero: string
    then:
      - media_player.stop:
          id: external_media_player
          announcement: true
      - delay: 60ms
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_media_url("audio-file://" + fichero)
            .set_announcement(true)
            .perform();

  # -------------------------------------------------- COLOR DE UN ELEMENTO
  # Unico sitio que traduce "elemento n" a un color: pone el aro ENTERO de
  # ese color, fijo. Se usa al mostrar la secuencia y al pulsar.
  - id: totem_color
    mode: restart
    parameters:
      elemento: int
    then:
      - light.turn_off: {id: voice_assistant_leds}
      - light.turn_on:
          id: led_ring
          brightness: 100%
          # fuego rojo, agua verde, aire azul, tierra LILA (era amarillo;
          # cambiado el 2026-09-12 al romperse el pulsador amarillo y
          # sustituirlo por uno lila).
          red: !lambda   'static const float r[4] = {1.0f, 0.0f, 0.0f, 0.75f}; return r[elemento & 3];'
          green: !lambda 'static const float g[4] = {0.0f, 1.0f, 0.0f, 0.10f}; return g[elemento & 3];'
          blue: !lambda  'static const float b[4] = {0.0f, 0.0f, 1.0f, 1.00f}; return b[elemento & 3];'

  # -------------------------------------------------- ARMAR (triple clic)
  # Limpia lo que hubiera, sortea la secuencia entera y arranca la ronda 1.
  - id: totem_armar
    mode: restart
    then:
      - script.stop: totem_mostrar
      - script.stop: totem_espera
      - script.stop: totem_ganar
      - script.stop: totem_perder
      - media_player.stop:
          id: external_media_player
          announcement: true
      - light.turn_off: {id: voice_assistant_leds}
      - lambda: |-
          for (int i = 0; i < 16; i++) id(totem_secuencia)[i] = random_uint32() % 4;
          id(totem_nivel) = ${objetivo};   // una sola ronda con todos
          id(totem_pos) = 0;
          id(totem_estado) = 1;   // MOSTRANDO (desde ya se ignoran los elementos)
          char s[32] = {0};
          for (int i = 0; i < ${objetivo}; i++) s[i] = '0' + id(totem_secuencia)[i];
          ESP_LOGI("totem", "partida nueva, secuencia %s (0 fuego 1 agua 2 aire 3 tierra)", s);
      - light.turn_on:
          id: led_ring
          effect: "espiritu"
          brightness: 100%
      # Respiro: deja terminar el "clic" del triple clic de fabrica (1.5 s).
      - delay: 1600ms
      # Aviso: Piiii, Pii, Pi, y arranca la secuencia.
      - script.execute:
          id: totem_sonar
          fichero: "snd_cuenta"
      - delay: 2300ms          # cuenta.flac 1.96 s
      - script.execute: totem_mostrar

  # -------------------------------------------------- MOSTRAR la ronda
  # Toca los `nivel` primeros pasos (luz + sonido a la vez, pausa a
  # oscuras entre medias) y despues abre el turno del jugador.
  - id: totem_mostrar
    mode: restart
    then:
      - lambda: |-
          id(totem_estado) = 1;
          id(totem_i) = 0;
          ESP_LOGI("totem", "secuencia de %d elementos", id(totem_nivel));
      - light.turn_off: {id: voice_assistant_leds}
      - light.turn_on:
          id: led_ring
          effect: "espiritu"
          brightness: 100%
      - delay: 300ms
      - while:
          condition:
            lambda: 'return id(totem_i) < id(totem_nivel);'
          then:
            - script.execute:
                id: totem_color
                elemento: !lambda 'return id(totem_secuencia)[id(totem_i)];'
            - script.execute:
                id: totem_sonar
                fichero: !lambda 'return "snd_voz" + std::to_string(id(totem_secuencia)[id(totem_i)]);'
            - delay: ${paso_on_ms}ms
            - light.turn_off: {id: led_ring}
            - delay: ${paso_off_ms}ms
            - lambda: 'id(totem_i)++;'

      # Turno del jugador: aro verde con punto blanco girando.
      - lambda: |-
          id(totem_pos) = 0;
          id(totem_estado) = 2;
      - light.turn_on:
          id: led_ring
          effect: "turno"
          brightness: 100%
      - script.execute: totem_espera

  # -------------------------------------------------- VENTANA DE RESPUESTA
  # Si el jugador tarda mas de la cuenta en pulsar el siguiente elemento, se
  # pierde. Cada acierto reinicia este script (mode: restart), el fin de
  # ronda o un fallo lo paran. No hay mas cronometro que estos delays.
  - id: totem_espera
    mode: restart
    then:
      - delay: !lambda 'return ${ventana_ms} - ${aviso_ms};'
      # Aviso: los mismos pitidos del principio. Si el jugador pulsa
      # durante el aviso, la palabra del boton los corta (totem_sonar) y
      # este script se reinicia; no hace falta nada mas.
      - script.execute:
          id: totem_sonar
          fichero: "snd_cuenta"
      - delay: ${aviso_ms}ms
      - logger.log: "totem: tiempo agotado"
      - script.execute: totem_perder

  # -------------------------------------------------- PULSAR un elemento
  # mode: parallel: cada pulsacion lleva su propia luz de 350 ms sin que
  # una pulsacion rapida mate la anterior. La logica del juego va TODA en
  # la parte sincrona del script (antes del primer delay), asi que dos
  # pulsaciones seguidas se procesan en orden y sin entrelazarse.
  - id: totem_pulsar
    mode: parallel
    max_runs: 6
    parameters:
      elemento: int
    then:
      # Mientras el totem muestra la secuencia, los elementos no hacen nada
      # (ni sonido: cortaria el paso que esta sonando).
      - if:
          condition:
            lambda: 'return id(totem_estado) == 1;'
          then:
            - lambda: 'ESP_LOGD("totem", "elemento %d ignorado (mostrando)", elemento);'
          else:
            # Feedback siempre, tambien en reposo (sirve de prueba del
            # cableado): el aro se pone del color del elemento y se dice
            # la palabra.
            - script.execute:
                id: totem_color
                elemento: !lambda 'return elemento;'
            - script.execute:
                id: totem_sonar
                fichero: !lambda 'return "snd_voz" + std::to_string(elemento);'
            - if:
                condition:
                  lambda: 'return id(totem_estado) == 2;'
                then:
                  - lambda: |-
                      if (id(totem_secuencia)[id(totem_pos)] == elemento) {
                        id(totem_pos)++;
                        id(totem_resultado) = (id(totem_pos) >= id(totem_nivel)) ? 2 : 1;
                      } else {
                        id(totem_resultado) = 3;
                      }
                      ESP_LOGI("totem", "elemento %d -> %s", elemento,
                               id(totem_resultado) == 1 ? "bien, sigue"
                             : id(totem_resultado) == 2 ? "ronda completa" : "FALLO");
                  - if:
                      condition:
                        lambda: 'return id(totem_resultado) == 1;'
                      then:
                        - script.execute: totem_espera   # reinicia la ventana
                  - if:
                      condition:
                        lambda: 'return id(totem_resultado) == 2;'
                      then:
                        - script.stop: totem_espera
                        - lambda: 'id(totem_estado) = 1;'   # cierra el turno ya
                        - script.execute: totem_ganar
                  - if:
                      condition:
                        lambda: 'return id(totem_resultado) == 3;'
                      then:
                        - script.stop: totem_espera
                        - script.execute: totem_perder
            - delay: 400ms
            # Devuelve el aro a lo que toque. Solo si seguimos respondiendo
            # (turno) o en reposo (apagado): si entre medias ha empezado la
            # siguiente ronda, la victoria o la erupcion, el aro es suyo.
            - if:
                condition:
                  lambda: 'return id(totem_estado) == 2;'
                then:
                  - light.turn_on:
                      id: led_ring
                      effect: "turno"
                      brightness: 100%
            - if:
                condition:
                  lambda: 'return id(totem_estado) == 0;'
                then:
                  - light.turn_off: {id: led_ring}

  # -------------------------------------------------- GANAR
  - id: totem_ganar
    mode: restart
    then:
      - script.stop: totem_mostrar
      - script.stop: totem_espera
      - lambda: 'id(totem_estado) = 3;'
      - logger.log: "totem: GANADA"
      - light.turn_off: {id: voice_assistant_leds}
      - light.turn_on:
          id: led_ring
          effect: "hoguera"
          brightness: 100%
      - delay: 500ms           # que se oiga entera la ultima palabra
      - script.execute:
          id: totem_sonar
          fichero: "snd_bien_ganado"
      - delay: 2200ms          # bien_ganado.flac 1.88 s
      - light.turn_on:
          id: led_ring
          effect: "arcoiris"
          brightness: 100%
      - delay: 3s
      - script.execute: totem_reposo

  # -------------------------------------------------- PERDER
  - id: totem_perder
    mode: restart
    then:
      - script.stop: totem_mostrar
      - script.stop: totem_espera
      - lambda: 'id(totem_estado) = 4;'
      - logger.log: "totem: PERDIDA"
      - light.turn_off: {id: voice_assistant_leds}
      - light.turn_on:
          id: led_ring
          red: 100%
          green: 0%
          blue: 0%
          brightness: 100%
      - delay: 400ms           # que no pise la palabra del boton fallado
      - script.execute:
          id: totem_sonar
          fichero: "snd_perdiste"
      - delay: 1500ms          # has_perdido.flac 1.1 s
      - light.turn_on:
          id: led_ring
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
      - delay: 1500ms
      - script.execute: totem_reposo

  # -------------------------------------------------- REPOSO
  # No hay cables que reempalmar: el totem vuelve solo a espera. En espera
  # los elementos siguen sonando al pulsarlos (para jugar con ellos y para
  # comprobar el cableado), pero no hay partida hasta el triple clic.
  - id: totem_reposo
    mode: restart
    then:
      - lambda: 'id(totem_estado) = 0;'
      - light.turn_off: {id: led_ring}
      - logger.log: "totem: en reposo, triple clic para armar"


# ---------------------------------------------------------------------
#  [8] MANTENIMIENTO EN SEGUNDO PLANO
# ---------------------------------------------------------------------

interval:
  # Mantener apagada la otra particion del aro mientras haya partida (ver
  # cabecera y v1). En reposo se deja al firmware de fabrica hacer lo suyo.
  - interval: 500ms
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(totem_estado) != 0;'
              - light.is_on: voice_assistant_leds
          then:
            - light.turn_off: {id: voice_assistant_leds}
